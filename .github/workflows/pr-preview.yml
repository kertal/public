name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One group per PR so unrelated PRs (or main) can't cancel a queued cleanup
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    # Fork PRs get a read-only token and can't push or comment; skip them
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy / remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          # Adds / updates a sticky comment on the PR with the preview URL,
          # and removes the preview when the PR is closed or merged.
          action: auto
